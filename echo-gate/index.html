<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Echo Gate</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="phone">
    <canvas id="view"></canvas>
    <div id="stick-base" class="stick"></div>
    <div id="stick-knob" class="stick knob"></div>
    <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2 L19 12 L8 18.8 Z"/></svg></button>
    <div id="start">
      <div class="logo">ECHO<br>GATE</div>
      <div class="build"><span id="build-ver">v …</span><span id="build-notes"></span></div>
    </div>
    <button id="shop-btn" type="button" aria-label="Shop">$</button>
    <button id="gear-btn" type="button" aria-label="Backpack"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 5.5C13 3.6 14.3 3 16 3s3 .6 3 2.5V7h-2V5.6c0-.4-.4-.6-1-.6s-1 .2-1 .6V7h-2z"/><path d="M16 6.5c4.4 0 7.5 2.7 7.5 6.5v1.5h-15V13c0-3.8 3.100-6.500 7.500-6.500zM7 15h18v10c0 2.200-1.800 4-4 4H11c-2.200 0-4-1.800-4-4zm3 4.500V25c0 .6.400 1 1 1h10c.6 0 1-.4 1-1v-5.500c0-.6-.4-1-1-1H11c-.6 0-1 .4-1 1zm5-.5h2v2.500h-2zM4 17.500c0-.8.700-1.500 1.500-1.500H6v8h-.5C4.700 24 4 23.300 4 22.500zm24 0v5c0 .8-.7 1.500-1.500 1.500H26v-8h.5c.8 0 1.500.7 1.500 1.500z" fill-rule="evenodd"/></svg></button>
    <button id="pause-btn" type="button" aria-label="Pause" class="gone"><i></i><i></i></button>
    <div id="pause"><div class="box"><div class="ttl">PAUSE</div><button type="button" aria-label="Resume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2 L19 12 L8 18.8 Z"/></svg></button></div></div>
    <div id="fps" aria-hidden="true">-- fps</div>
    <div id="toast" role="status"></div>
    <div id="fade"></div>
  </div>
  <!-- Загрузка с защитой от кеша: номер сборки берём из version.json (без кеша) и дописываем ?v=N ко всем модулям через import map.
       Иначе телефон может годами показывать старый код. Список модулей = файлы src/ (проверяет tests/echo-gate-motion.mjs). -->
  <script>
    (async () => {
      let build = '0';
      try { build = String((await (await fetch('version.json', { cache: 'no-store' })).json()).build || '0'); } catch (e) { /* без сети с кешем */ }
      const files = ['attack', 'beetle', 'bull', 'config', 'drops', 'enemy_shots', 'events', 'game', 'gear', 'hero', 'hub', 'hud', 'input_keys', 'input_stick', 'input_swipe', 'inventory', 'inventory_ui', 'inventory_view', 'iso', 'items', 'loot', 'main', 'midge_view', 'midges', 'motion', 'rock', 'scatter', 'settings', 'shooter', 'shop', 'spawner', 'staff', 'staff_model', 'staff_ui', 'stats', 'swarm', 'telegraph', 'timestep', 'version', 'world'];
      const imports = { three: './vendor/three.module.js' };
      for (const f of files) imports[new URL('./src/' + f + '.js', location.href).href] = './src/' + f + '.js?v=' + build;
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({ imports });
      document.head.appendChild(map);
      import('./src/main.js?v=' + build);
    })();
  </script>
</body>
</html>
